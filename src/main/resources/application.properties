spring.application.name=user-management-system
#spring.profiles.active=${SPRING_PROFILES_ACTIVE:db}
#spring.profiles.active=memory
spring.profiles.active=db
server.port=${SERVER_PORT:8080}

# ===============================
# JWT Configuration
# ===============================
# Use environment variable in production; fallback to dev default locally
jwt.secret=${JWT_SECRET:YzJhMWE5NGY4Y2MwN2Q2MjM0ZjVhZjQ4NzY0ODNiNTA5MjQ2ZjQxYjQ3YzA5YmFmN2ZmOTRhNmRmMTNhNjg2Mw==}
#jwt.expiration=3600000
jwt.expiration=${JWT_EXPIRATION:300000}

# ===============================
# Logging Configuration
# ===============================

# Root logging level
logging.level.root=INFO

# Application-specific logging
#logging.level.com.usermanagement=DEBUG

# Spring Framework logging
logging.level.org.springframework=INFO

# Hibernate SQL logging (optional)
#logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Log file
logging.file.name=logs/application.log

# Log pattern for console
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Log pattern for file
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ===============================
# Default Admin Configuration
# ===============================
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.first-name=${ADMIN_FIRST_NAME:System}
app.admin.last-name=${ADMIN_LAST_NAME:Admin}
app.admin.email=${ADMIN_EMAIL:admin@gmail.com}
app.admin.password=${ADMIN_PASSWORD:Admin@123}
app.admin.role=${ADMIN_ROLE:ROLE_ADMIN}

# ===============================
# Spring Boot Actuator
# ===============================
# Expose health endpoint for Docker HEALTHCHECK
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.health.defaults.enabled=true